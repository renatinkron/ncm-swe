# Tiny VQ-VAE fixture for fast resume-test coverage (mirrors test_vq.TINY).
in_vocab_size: 256
context_length: 16
embed_dim: 32
vqvae_vocab_size: [64, 64, 64]
n_layers: 2
compression_factor: 1
dropout: 0.0
use_qk_norm: true
pre_quant_groupnorm: 4
enc_layers: 1
dec_layers: 1
enc_positional: true
dec_positional: true
vector_quantizer:
  clss: multiscale_residual_vector_quantizer
  decay: 0.99
  epsilon: 0.00001
  commitment_cost: 0.25
  restart_threshold: 0.005
  learned_l1_sampling: false
  learned_all_sampling: false
  quant_resi:
    enabled: true
    ratio: 0.5
    share_mode: 0
    learnable_ratio: false
  levels:
    use_manual_levels: true
    manual_levels: [1, 4, 16]
  aux:
    fine_drop:
      dual: false
      prob: 0.0
      min_keep: 1
      w_full: 1.0
      w_trunc: 0.0
    code_corruption:
      enabled: false
